<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GlassMed — rabbit fishing from a crescent moon inside a glass bubble">
  <defs>
    <radialGradient id="bubbleTint" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#a2a2d0" stop-opacity="0.16" />
      <stop offset="0.6" stop-color="#78a2d2" stop-opacity="0.07" />
      <stop offset="1" stop-color="#78a2d2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moonGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e6ecf7" />
    </linearGradient>
    <mask id="moonCut">
      <rect width="512" height="512" fill="white" />
      <circle cx="302" cy="208" r="118" fill="black" />
    </mask>
    <linearGradient id="tapeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ecf4" />
      <stop offset="1" stop-color="#c9d0de" />
    </linearGradient>
    <radialGradient id="blobBody" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#c9a8f7" />
      <stop offset="1" stop-color="#8f6ad9" />
    </radialGradient>
  </defs>

  <!-- soft dreamy tint inside the bubble -->
  <circle cx="256" cy="256" r="222" fill="url(#bubbleTint)" />

  <!-- glossy white crescent moon, opening down-left, rabbit on the top curve -->
  <circle cx="300" cy="332" r="150" fill="url(#moonGloss)" mask="url(#moonCut)" />
  <circle cx="300" cy="332" r="150" fill="none" stroke="#dfe6f2" stroke-width="2" mask="url(#moonCut)" opacity="0.6" />

  <!-- paper airplane, upper left -->
  <g>
    <path d="M154 88 L88 138 L152 150 Z" fill="#f6f8fd" stroke="#c9d2e2" stroke-width="2" stroke-linejoin="round" />
    <path d="M154 88 L120 142 L88 138 Z" fill="#e8edf6" stroke="#c9d2e2" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M154 88 L120 142" stroke="#c9d2e2" stroke-width="1.5" />
  </g>

  <!-- two bright four-pointed stars, upper right -->
  <path d="M352 96 L358 112 L374 118 L358 124 L352 140 L346 124 L330 118 L346 112 Z" fill="#ffffff" opacity="0.95" />
  <path d="M398 70 L402.5 81 L413.5 85.5 L402.5 90 L398 101 L393.5 90 L382.5 85.5 L393.5 81 Z" fill="#dff0ff" />

  <!-- rabbit, perched on the moon's top curve, facing left -->
  <g>
    <!-- ears -->
    <g transform="rotate(-12 178 162)">
      <ellipse cx="178" cy="162" rx="10" ry="30" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
      <ellipse cx="178" cy="166" rx="4.5" ry="19" fill="#f7c7d4" />
    </g>
    <g transform="rotate(14 212 158)">
      <ellipse cx="212" cy="158" rx="10" ry="30" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
      <ellipse cx="212" cy="162" rx="4.5" ry="19" fill="#f7c7d4" />
    </g>
    <!-- body + head -->
    <ellipse cx="196" cy="248" rx="30" ry="27" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
    <circle cx="196" cy="206" r="27" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
    <!-- face, slightly left -->
    <circle cx="185" cy="203" r="4.5" fill="#33415c" />
    <circle cx="205" cy="203" r="4.5" fill="#33415c" />
    <circle cx="183.5" cy="201.5" r="1.5" fill="#ffffff" />
    <circle cx="203.5" cy="201.5" r="1.5" fill="#ffffff" />
    <ellipse cx="196" cy="215" rx="3" ry="2.2" fill="#f2a3b8" />
    <path d="M190 219 Q196 224 202 219" stroke="#c77b93" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="171" cy="214" r="5.5" fill="#ffd9e3" opacity="0.85" />
    <circle cx="218" cy="212" r="5.5" fill="#ffd9e3" opacity="0.85" />
    <!-- paws + feet -->
    <circle cx="172" cy="238" r="7" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
    <circle cx="222" cy="240" r="7" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
    <ellipse cx="180" cy="269" rx="10" ry="6" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
    <ellipse cx="210" cy="270" rx="10" ry="6" fill="#ffffff" stroke="#dfe6f2" stroke-width="1.5" />
  </g>

  <!-- wooden fishing rod, held by the right paw -->
  <path d="M222 240 Q270 170 320 148" stroke="#9a6b3f" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- fishing line + hook -->
  <path d="M320 148 L320 332" stroke="#5a6276" stroke-width="2" fill="none" />
  <path d="M320 332 C 326 336 328 344 320 348" stroke="#5a6276" stroke-width="2" fill="none" />

  <!-- miniature white lab coat hanging on the hook -->
  <g>
    <rect x="292" y="340" width="56" height="66" rx="10" fill="#ffffff" stroke="#c3cbd8" stroke-width="2" />
    <g transform="rotate(14 298 344)">
      <rect x="290" y="340" width="14" height="26" rx="6" fill="#ffffff" stroke="#c3cbd8" stroke-width="2" />
    </g>
    <g transform="rotate(-14 350 344)">
      <rect x="344" y="340" width="14" height="26" rx="6" fill="#ffffff" stroke="#c3cbd8" stroke-width="2" />
    </g>
    <rect x="312" y="334" width="16" height="10" rx="4" fill="#ffffff" stroke="#c3cbd8" stroke-width="2" />
    <path d="M312 356 L328 356" stroke="#e3e9f2" stroke-width="2" stroke-linecap="round" />
    <path d="M312 368 L328 368" stroke="#e3e9f2" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- sketchy music notes, right side -->
  <path d="M413 146 C402 154 402 170 413 176 C423 181 423 196 411 200 C399 204 398 222 410 226 C418 229 422 217 414 210" stroke="#2a2f45" stroke-width="5" fill="none" stroke-linecap="round" />
  <circle cx="406" cy="236" r="3" fill="#2a2f45" />
  <g>
    <ellipse cx="368" cy="306" rx="8" ry="6" fill="#2a2f45" transform="rotate(-20 368 306)" />
    <path d="M375 306 L375 270" stroke="#2a2f45" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="398" cy="306" rx="8" ry="6" fill="#2a2f45" transform="rotate(-20 398 306)" />
    <path d="M405 306 L405 270" stroke="#2a2f45" stroke-width="4" stroke-linecap="round" />
    <path d="M375 268 L405 268" stroke="#2a2f45" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- retro cassette tape, bottom center -->
  <g>
    <rect x="196" y="378" width="112" height="68" rx="12" fill="url(#tapeBody)" stroke="#98a2b5" stroke-width="2" />
    <rect x="206" y="388" width="92" height="20" rx="6" fill="#f2f5fa" stroke="#cfd6e2" stroke-width="1.5" />
    <circle cx="218" cy="398" r="3" fill="#b9c2d4" />
    <circle cx="286" cy="398" r="3" fill="#b9c2d4" />
    <circle cx="236" cy="428" r="15" fill="#2e3547" />
    <circle cx="236" cy="428" r="6" fill="#d9dee8" />
    <circle cx="268" cy="428" r="15" fill="#2e3547" />
    <circle cx="268" cy="428" r="6" fill="#d9dee8" />
    <circle cx="210" cy="440" r="2.5" fill="#98a2b5" />
    <circle cx="294" cy="440" r="2.5" fill="#98a2b5" />
  </g>

  <!-- glossy purple blob, right of the cassette -->
  <g>
    <path d="M360 398 C378 398 390 412 390 428 C390 446 378 458 360 458 C344 458 332 446 332 428 C332 412 344 398 360 398 Z" fill="url(#blobBody)" opacity="0.92" />
    <ellipse cx="350" cy="408" rx="10" ry="5" fill="#ffffff" opacity="0.35" transform="rotate(-24 350 408)" />
    <circle cx="348" cy="424" r="3.5" fill="#2e2a4a" />
    <circle cx="372" cy="424" r="3.5" fill="#2e2a4a" />
    <circle cx="349.5" cy="422.8" r="1.2" fill="#ffffff" />
    <circle cx="373.5" cy="422.8" r="1.2" fill="#ffffff" />
    <path d="M354 436 Q360 441 366 436" stroke="#4a3a75" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="342" cy="432" r="4.5" fill="#e8c4f5" opacity="0.8" />
    <circle cx="378" cy="432" r="4.5" fill="#e8c4f5" opacity="0.8" />
  </g>

  <!-- the glass sphere: rim, top-left highlight, bottom-right sheen -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" />
  <path d="M78 160 A 205 205 0 0 1 170 72" stroke="#ffffff" stroke-opacity="0.5" stroke-width="16" fill="none" stroke-linecap="round" />
  <ellipse cx="380" cy="402" rx="58" ry="24" fill="#ffffff" opacity="0.1" transform="rotate(-18 380 402)" />
</svg>
